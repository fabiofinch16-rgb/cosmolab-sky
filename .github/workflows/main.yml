name: Build Android AAB

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build AAB
        run: |
          # Encontra a pasta raiz real do projeto Android (onde está o settings.gradle)
          SETTINGS_FILE=$(find . -name "settings.gradle*" -type f | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle nao encontrado!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "Entrando na pasta do projeto: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle bundleRelease || gradle bundle

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/*.aab'

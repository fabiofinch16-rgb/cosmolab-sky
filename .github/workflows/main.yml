name: Build Android AAB

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build AAB Automatically
        run: |
          # Encontra o diretório onde está o arquivo gradlew
          GRADLEW_FILE=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "Arquivo gradlew nao encontrado no repositorio!"
            exit 1
          fi
          TARGET_DIR=$(dirname "$GRADLEW_FILE")
          echo "Projeto encontrado em: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew
          ./gradlew bundleRelease || ./gradlew bundle

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/*.aab'

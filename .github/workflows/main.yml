name: Build Android AAB

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build AAB with System Gradle
        run: |
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Nenhum arquivo de build encontrado!"
            exit 1
          fi
          cd "$BUILD_DIR"
          gradle bundleRelease || gradle bundle

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/*.aab'
